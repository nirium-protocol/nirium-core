# Crate AISLADO a propósito: `stellar-accounts` exige soroban-sdk ^26.1.0 y
# NiriumVault/NiriumProtocol están en 22.0.0 y ya desplegados. Subir el
# workspace entero para esto tocaría contratos en producción sin necesidad —
# esta cuenta de política no comparte código con ellos.
#
# El `[workspace]` vacío lo saca del workspace raíz.
[workspace]

[package]
name = "nirium-policy-account"
version = "0.1.0"
edition = "2021"
authors = ["Nirium Protocol"]
description = "Smart account que acota la llave del agente a una sola bóveda de DeFindex"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"
stellar-accounts = "0.7.2"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
