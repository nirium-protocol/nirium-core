name: CI — Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` here on purpose — same fix as security-gate.yml.
        # action-setup@v4 reads it from package.json's own "packageManager"
        # field; pinning both is ERR_PNPM_BAD_PM_VERSION (version 10 here
        # vs pnpm@9.12.2 in package.json).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter nirium build

      - name: Build Agent
        run: |
          # packages/agent/scripts/obfuscate.js only exists in the private
          # repo. The public mirror (nirium-protocol/nirium-core, renamed from Eras256/Nirium 22-oct-2026) ships packages/agent as
          # a deliberate placeholder — no real agent source, by design (see
          # AGENTS.md: "Sync al repo público" — never a raw push, always the
          # quirurgical/rebuild-public-repo.sh copy that leaves the agent as
          # a stub) — so `tsc && node scripts/obfuscate.js` can never pass
          # there. Skip with a clear message instead of failing on a step
          # that was never meant to run against a stub.
          if [ -f packages/agent/scripts/obfuscate.js ]; then
            pnpm --filter agent build
          else
            echo "packages/agent/scripts/obfuscate.js not found — skipping Build Agent (placeholder agent, expected in the public mirror)."
          fi

      - name: Build CLI
        run: pnpm --filter nirium-cli build

      - name: Build Web
        run: pnpm --filter nirium-web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:3002
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            nirium-soroban-contracts/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Soroban CLI
        run: cargo install soroban-cli --locked || true

      - name: Build Contracts
        run: cargo build --release --manifest-path nirium-soroban-contracts/Cargo.toml

      - name: Run Contract Tests
        run: cargo test --manifest-path nirium-soroban-contracts/Cargo.toml
