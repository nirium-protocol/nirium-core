name: Security Gate — Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-audit:
    name: Rust Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      # RUSTSEC-2026-0387 (crypto-bigint 0.5.5, timing variability) is a real,
      # structural dead end, not an oversight: elliptic-curve 0.13.8 (pulled
      # in by soroban-env-host 22.1.3, which is locked to our deployed
      # soroban-sdk 22.0.11) requires crypto-bigint = "^0.5" - the first fixed
      # release is 0.7.6, two major versions away, and cargo refuses to
      # resolve it (confirmed 2026-10-24: `cargo update -p crypto-bigint
      # --precise 0.7.6` fails with "candidate versions found which didn't
      # match"). The real fix is a soroban-sdk major-version bump, a separate
      # and much larger decision - not something to roll into a dependency
      # audit fix. Ignored here so the gate reflects a real, dated decision
      # instead of staying red for a vulnerability nobody can act on from
      # this repo alone. Revisit when soroban-sdk moves past 22.x.
      - name: Run Cargo Audit
        run: cargo audit --ignore RUSTSEC-2026-0387

  node-audit:
    name: Node.js Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` here on purpose — action-setup@v4 reads it from
        # package.json's own "packageManager" field. Pinning both is what
        # broke this (ERR_PNPM_BAD_PM_VERSION: version 10 here vs 9.12.2
        # in package.json, action-setup refuses to pick one).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GHSA-mrhx-c7xc-m3w5 (zod < 4.6.6, high, memory exhaustion on
      # oversized array validation): two separate paths resolved to it.
      # @stellar/mpp > mppx > viem/abitype/incur > zod was fixed for real
      # via pnpm.overrides["zod@4"]: "^4.6.6" in package.json — every
      # package on that path already accepts zod ^4.x, so this bumps it
      # to a patched version, it doesn't force anything. Verified
      # 2026-10-23: `pnpm why zod` shows that whole subtree resolving to
      # 4.6.7; this app builds clean, packages/sdk and packages/mcp both
      # build clean (tsc), packages/mcp (which imports zod directly for
      # its own tool schemas) boots and registers all tools without
      # error. @x402/core (resolved here, 2.9.0) still requires zod
      # ^3.24.2, which cannot resolve to 4.x even with the override —
      # confirmed against the latest published @x402/core (2.28.0), same
      # range. No patched 3.x release of zod exists either. That
      # remaining instance is allowlisted below via
      # pnpm.auditConfig.ignoreGhsas in package.json. Every other high
      # finding still blocks the build. Revisit when @x402/core moves to
      # zod 4 (no issue filed upstream yet as of this date).
      - name: Run pnpm Audit (high+ — blocks build)
        run: pnpm audit --audit-level=high

  contract-fuzz:
    name: Smart Contract Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Nightly (required for cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || true

      - name: Fuzz Flash Loan (60s smoke)
        # No working-directory: fuzz — `cargo fuzz run` already resolves
        # ./fuzz/Cargo.toml from wherever it's invoked; running it a second
        # time from inside fuzz/ makes it look for fuzz/fuzz/Cargo.toml,
        # which doesn't exist (this is what broke it).
        run: cargo +nightly fuzz run fuzz_flash_loan -- -max_total_time=60 2>&1 || exit 1

      - name: Fuzz Vault Create (60s smoke)
        # No working-directory: fuzz — `cargo fuzz run` already resolves
        # ./fuzz/Cargo.toml from wherever it's invoked; running it a second
        # time from inside fuzz/ makes it look for fuzz/fuzz/Cargo.toml,
        # which doesn't exist (this is what broke it).
        run: cargo +nightly fuzz run fuzz_vault_create -- -max_total_time=60 2>&1 || exit 1
