[package]
name = "nirium-protocol"
version = "0.1.0"
edition = "2021"
authors = ["Nirium Protocol"]
description = "Nirium Protocol Registry — ELO reputation, strategy marketplace, agent scoring, skill gate"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
